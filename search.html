<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search - Seli Help Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/help.css">
<meta name="description" content="Search all Seli Help Center articles - Seli Market, Seli Pilot, Shemi AI, escrow, payments and more.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://help.seli.com.ng/search.html">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body data-section="" data-page="">

<!-- Navbar -->
<nav class="help-navbar navbar">
  <div class="container-fluid px-3 px-md-4 d-flex align-items-center">
    <button class="sidebar-toggle-btn d-lg-none" id="sidebarToggleBtn" aria-label="Open menu"><i class="bi bi-list"></i></button>
    <a href="index.html" class="help-logo">
      <span class="help-logo-icon"><img src="images/seli_logo_white.png" width="100%" height="100%" alt="Seli" /></span>
      <span class="brand-text"><strong>Seli</strong><small>Help Center</small></span>
    </a>
    <div class="navbar-search-wrap search-relative ms-3 flex-grow-1">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control help-search-input" placeholder="Search help articles…" autocomplete="off" aria-label="Search help articles">
      </div>
    </div>
    <a href="https://seli.com.ng" class="btn go-to-app ms-3" target="_blank" rel="noopener">seli.com.ng <i class="bi bi-arrow-right"></i></a>
  </div>
</nav>

<section class="help-hero" style="padding:48px 0">
  <div class="container">
    <h1 style="font-size:1.7rem"><span class="results-query" id="searchQuery">…</span></h1>
    <div class="hero-search-wrap search-relative">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control help-search-input" id="heroSearch" placeholder="Search Seli Help Center…" autocomplete="off" aria-label="Search the help center">
      </div>
    </div>
  </div>
</section>

<section class="section-block" style="padding-bottom:48px">
  <div class="container">
    <div class="results-box">
      <p class="results-summary" id="resultsSummary"></p>
      <div class="results-list" id="searchResults"></div>
    </div>
  </div>
</section>

<footer class="help-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
    <div class="footer-links">
      <a href="index.html">Help Home</a>
      <a href="https://about.seli.com.ng/privacy">Privacy Policy</a>
      <a href="https://about.seli.com.ng/tos">Terms of Service</a>
      <a href="https://about.seli.com.ng/contact">Contact</a>
    </div>
    <p><span id="year"></span> Seli. Made in Lagos, Nigeria.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/help.js"></script>
</body>
</html>
